<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de requerimiento de cumplimiento de comodato</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--g:#3f8f2a;--gd:#2f6d1f;--ink:#1f2a1c;--mut:#5d6b58;--line:#d9e2d4;--bg:#f3f6f1}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:3px solid var(--g);padding:16px 20px}
header h1{margin:0;font-size:19px}
header p{margin:4px 0 0;color:var(--mut);font-size:13.5px}
main{max-width:1100px;margin:0 auto;padding:20px;display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
label{display:block;font-weight:600;font-size:13.5px;margin:0 0 4px}
.f{margin-bottom:14px}
input{width:100%;padding:10px 11px;border:1px solid #c6d2c0;border-radius:8px;font:inherit;background:#fff}
input:focus{outline:2px solid var(--g);outline-offset:0;border-color:var(--g)}
small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.btns{display:flex;gap:10px;margin-top:6px}
button{flex:1;padding:11px 14px;border-radius:8px;border:1px solid var(--g);font:inherit;font-weight:600;cursor:pointer}
#dl{background:var(--g);color:#fff}
#dl:hover{background:var(--gd)}
#rs{background:#fff;color:var(--gd)}
#msg{min-height:20px;font-size:13px;margin-top:10px;color:var(--mut)}
#msg.err{color:#b3261e}
.pv{background:#e4e9e1;border-radius:12px;padding:14px;overflow:auto}
.pv canvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.pvt{font-size:12.5px;color:var(--mut);margin:0 0 8px}
</style>
</head>
<body>
<header>
  <h1>Requerimiento de cumplimiento de comodato</h1>
  <p>Cambia los datos, revisa la vista previa y descarga el PDF. Todo se genera en tu dispositivo.</p>
</header>
<main>
  <section class="card">
    <div class="f"><label for="fecha">Fecha del requerimiento</label><input id="fecha" type="date"></div>
    <div class="f"><label for="dest">Destinatario (Junta / entidad)</label><input id="dest" type="text" value="Junta de Acción Comunal Barrio Mutis"></div>
    <div class="f"><label for="correo">Correo del destinatario</label><input id="correo" type="text" inputmode="email" value="jacbarriomutis@gmail.com"></div>
    <div class="f"><label for="contrato">Contrato de comodato No.</label><input id="contrato" type="text" placeholder="Ej.: 123 de 2024"><small>Si lo dejas vacío, queda la línea en blanco para llenar a mano.</small></div>
    <div class="f"><label for="matricula">Matrícula inmobiliaria No.</label><input id="matricula" type="text" placeholder="Ej.: 300-123456"><small>Si lo dejas vacío, queda la línea en blanco.</small></div>
    <div class="f"><label for="consec">No. consecutivo</label><input id="consec" type="text" value="2-S-DADEP-202609-00086106"></div>
    <div class="btns"><button id="dl" type="button">Descargar PDF</button><button id="rs" type="button">Restablecer</button></div>
    <div id="msg" role="status"></div>
  </section>
  <section>
    <p class="pvt">Vista previa (se actualiza al escribir)</p>
    <div class="pv"><canvas id="cv" width="918" height="1512"></canvas></div>
  </section>
</main>

var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function $(i){return document.getElementById(i)}
function todayISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fechaTexto(iso){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");if(!m)return "";return parseInt(m[3],10)+" de "+MESES[parseInt(m[2],10)-1]+" de "+m[1]}
function datos(){return {fecha:fechaTexto($("fecha").value),destinatario:$("dest").value.trim(),correo:$("correo").value.trim(),contrato:$("contrato").value.trim(),matricula:$("matricula").value.trim(),consecutivo:$("consec").value.trim()}}

var measureDoc=null;
function getJsPDF(){return window.jspdf&&window.jspdf.jsPDF}
function W(s,f,z){measureDoc.setFont("helvetica",f);measureDoc.setFontSize(z);return measureDoc.getTextWidth(s)}

var imgEls={};
function loadImgs(cb){var n=0,ids=Object.keys(IMG);ids.forEach(function(k){var im=new Image();im.onload=function(){imgEls[k]=im;if(++n===ids.length)cb()};im.src=IMG[k]})}

function drawCanvas(ops){
  var cv=$("cv"),ctx=cv.getContext("2d"),s=cv.width/612;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.scale(s,s);
  ops.forEach(function(o){
    if(o.k==="text"){
      var st=o.font==="bolditalic"?"italic bold":o.font==="bold"?"bold":o.font==="italic"?"italic":"normal";
      ctx.font=st+" "+o.size+"px Helvetica, Arial, sans-serif";
      ctx.fillStyle="rgb("+o.color.join(",")+")";ctx.fillText(o.s,o.x,o.y);
    }else if(o.k==="line"){
      ctx.strokeStyle="rgb("+o.color.join(",")+")";ctx.lineWidth=o.w;ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke();
    }else if(o.k==="dot"){
      ctx.fillStyle="#000";ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.2832);ctx.fill();
    }else if(o.k==="img"&&imgEls[o.id]){ctx.drawImage(imgEls[o.id],o.x,o.y,o.w,o.h)}
  });
}
function refresh(){if(!measureDoc||!imgEls.logo)return;drawCanvas(buildOps(datos(),W))}

function makePDF(){
  var J=getJsPDF(),doc=new J({unit:"pt",format:[612,1008],compress:true});
  measureDoc=doc;
  var ops=buildOps(datos(),W);
  ops.forEach(function(o){
    if(o.k==="text"){doc.setFont("helvetica",o.font);doc.setFontSize(o.size);doc.setTextColor(o.color[0],o.color[1],o.color[2]);doc.text(o.s,o.x,o.y,{baseline:"alphabetic"})}
    else if(o.k==="line"){doc.setDrawColor(o.color[0],o.color[1],o.color[2]);doc.setLineWidth(o.w);doc.line(o.x1,o.y1,o.x2,o.y2)}
    else if(o.k==="dot"){doc.setFillColor(0,0,0);doc.circle(o.x,o.y,o.r,"F")}
    else if(o.k==="img"){doc.addImage(IMG[o.id],"PNG",o.x,o.y,o.w,o.h)}
  });
  return doc;
}
function nombreArchivo(){
  var d=datos(),base=(d.destinatario||"destinatario").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"");
  return "Requerimiento_comodato_"+base+".pdf";
}
function msg(t,err){var m=$("msg");m.textContent=t;m.className=err?"err":""}

async function descargar(){
  if(!getJsPDF()){msg("No se pudo cargar el generador de PDF. Revisa tu conexión y recarga.",true);return}
  var doc=makePDF(),name=nombreArchivo(),blob=doc.output("blob");
  var dls=null;try{dls=await claude.use("downloads")}catch(e){}
  if(dls){
    try{await dls.save({filename:name,data:blob});msg("PDF listo: "+name);return}
    catch(e){
      try{var buf=new Uint8Array(await blob.arrayBuffer());await dls.save({filename:name,data:buf});msg("PDF listo: "+name);return}
      catch(e2){msg("No se guardó el archivo (puede que hayas cancelado). Intenta de nuevo.",true);return}
    }
  }
  try{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();msg("Si no se descargó, abre esta página en una pestaña propia y vuelve a intentar.")}
  catch(e){msg("Descarga no disponible en este visor.",true)}
}
